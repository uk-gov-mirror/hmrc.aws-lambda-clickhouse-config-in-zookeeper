[tool.poetry]
name = "aws-lambda-clickhouse-config-in-zookeeper"
version = "0.0.0"
description = "An AWS Lambda that will which injects the 'remote-servers' config into Zookeeper"
readme = "README.md"
authors = ["Team Telemetry <telemetry@digital.hmrc.gov.uk>"]
maintainers = ["Team Telemetry"]
license = "Apache 2.0"

[[tool.poetry.source]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple/"

[tool.poetry.dependencies]
python = "^3.14.2"
aws-lambda-powertools = "^2.37.0"
boto3 = "^1.34.85"
cryptography = "^46.0.4"
kazoo = "^2.9.0"
pre-commit = "^4.5.1"
lxml = "^6.0.3"
# workaround for: https://github.com/python-poetry/poetry-plugin-export/issues/183
urllib3 = ">=1.25.4,<1.27"

[tool.poetry.group.dev.dependencies]
aws-lambda-context = "^1.1.0"
bandit = "^1.9.3"
black = "^26.1.0"
colorama = "^0.4.5"
coverage = "^7.13.5"
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
version-incrementor = "^1.10.0"
flake8 = "^7.0.0"
cookiecutter = "^2.1.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
